name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: php -l
        run: find wp-ai-case -name '*.php' -print0 | xargs -0 -n1 php -l

  contracts-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema==4.23.0
      - name: contract tests
        run: python3 tests/contracts/test_contracts.py
      - name: secret scan
        run: python3 tools/secret_scan.py
      - name: secret scan (history)
        run: python3 tools/secret_scan.py --history

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build and inspect ZIP (rehearsal version, not distributed)
        run: python3 tools/build_release.py --rehearsal-version 0.0.0
